name: CI

# Gates human pushes, which nothing gated before this existed.
#
# The refresh bot checks its dataset before opening a PR, then this workflow
# checks that PR alongside all other changes. Pushes from a workstation once
# had no such gate, and CLAUDE.md said
# so plainly ("nothing in CI gates it"). That is the path an invalid vercel.json
# took to production on 2026-08-28: the file was valid JSON, so no linter
# objected, and a local build never reads vercel.json, so two independent local
# builds went green while the deploy failed at config validation.
#
# This does not catch that particular bug -- nothing local can, because
# vercel.json is only read by Vercel. It catches everything else, and it means a
# red mark appears here rather than in a deploy notification.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this job builds and reports. It never commits, unlike the refresh
# workflow, which needs contents:write and pull-requests:write to propose a snapshot.
permissions:
  contents: read

# A superseded push has nothing useful to say. In-progress runs on a branch are
# cancelled when a newer commit lands, except on main, where every commit is a
# potential deploy and deserves its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Kept in step with the "engines" field in package.json. Both exist
      # because the repo pinned Node nowhere -- no engines, no .nvmrc, no
      # nodeVersion in vercel.json -- so the production build ran on whatever
      # Vercel happened to default to, and could change under us without a
      # commit.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify known CPU filtering
        run: npm run verify:cpu

      - name: Verify replay retries and metadata recovery
        run: npm run verify:replays

      - name: Verify special detection, cache migration and move comparisons
        run: npm run verify:moves

      - name: Verify interaction detection and experimental references
        run: npm run verify:interactions

      - name: Local forecast pipeline tests (fixtures only; no credentials)
        run: npm run test:forecast

      # tsc -b, vite build, then the static SEO pages. Deliberately not
      # build:deploy: that additionally renders the share GIFs through
      # @napi-rs/canvas, which is slow, and a failed render is explicitly
      # allowed not to fail a deploy. This is the same command the refresh
      # workflow gates the dataset with, so both paths now check the same thing.
      - name: Type-check and build
        run: npm run build

      # The three generated pages are the only HTML a crawler can read -- the
      # app itself serves an empty #root. If the renderer silently produced
      # nothing, the build would still be green and the site would quietly stop
      # being indexable, so assert the files exist rather than trusting exit 0.
      - name: Check the static pages were generated
        run: |
          for f in about.html metrics.html melee-majors.html sitemap.xml; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing or empty"
              exit 1
            fi
          done
          echo "all four generated files present"
