name: Refresh Liquipedia snapshot

# Weekly top-up of the bundled scene-history dataset: new majors since the
# last snapshot, plus any newly published SSBMRank edition. Majors land more
# often than monthly, and a run with nothing new costs one request and commits
# nothing. Changes are proposed on one reusable branch and published only
# after its pull request passes the required checks and is merged into main.
on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC every Monday
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: liquipedia-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Scheduled runs use main; ignore manual runs on unreviewed branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fetches only what's missing (majors dated after the snapshot, editions
      # not yet present) and rate-limits itself. Exit 2 means Liquipedia was
      # blocking us: data.ts is untouched, so treat it as "nothing to do" and
      # let next week's run pick it up rather than paging anyone with a red X.
      - name: Fetch new majors and rankings
        id: refresh
        run: |
          set +e
          node scripts/refresh-liquipedia.mjs
          code=$?
          if [ $code -eq 2 ]; then
            echo "::warning::Liquipedia rate-limited this run; snapshot unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
        env:
          LIQUIPEDIA_CONTACT: ${{ vars.LIQUIPEDIA_CONTACT || 'info.studio.pinball@gmail.com' }}

      # No asset render here on purpose: the share images are rendered during
      # the Vercel deploy instead. Committing them put ~2.5 MB of GIF into
      # history on every data change, and binaries never delta-compress.

      # A broken dataset must never reach main.
      - name: Type-check and build
        if: steps.refresh.outputs.changed == 'true'
        run: npm run build

      # Keep wiki-derived summary text in action inputs, never shell source.
      # Do not run on unchanged/rate-limited fetches: an existing update PR
      # must survive an unavailable upstream. Only data.ts may be committed.
      - name: Create or update snapshot pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/liquipedia-snapshot
          add-paths: src/lib/liquipedia/data.ts
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'Liquipedia snapshot: ${{ steps.refresh.outputs.summary }}'
          title: 'Update Liquipedia snapshot'
          body: |
            Updates the bundled Liquipedia snapshot with newly discovered majors, rankings, and player metadata.

            ${{ steps.refresh.outputs.summary }}

            Validation: the refresh workflow passed `npm run build` before proposing this update. Only `src/lib/liquipedia/data.ts` is included.

            If GitHub shows **Approve workflows to run**, approve the normal PR checks. The required `build` and `Vercel` checks must pass before merging; this bot does not merge or bypass branch protections.

            Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
